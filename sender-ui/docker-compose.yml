version: '3.8'

services:
  sender-ui:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sender-ui
    restart: unless-stopped
    ports:
      - "3001:3000"  # Use 3001 since 3000 is occupied
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    networks:
      - bluelime-network

networks:
  bluelime-network:
    driver: bridge
